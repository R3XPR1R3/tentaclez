[project]
name = "tentaclez"
version = "0.1.0"
description = "Signal-only trading bot for Robinhood (manual execution) — Telegram alerts, paper portfolio, dividend tracking"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta>=0.3.14b",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4",
    "APScheduler>=3.10",
    "python-telegram-bot[job-queue]>=21.0",
    "loguru>=0.7",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "tenacity>=8.3",
]

[project.scripts]
tentaclez = "tentaclez.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tentaclez"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
